<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>volumeshader_bm</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="main">
      <canvas id="c1" width="1024" height="1024">
        <span>浏览器不支持canvas</span>
      </canvas>
    </div>
    <button id="btn">CONFIG</button>
    <div id="config">
      <label for="backend">渲染后端</label>
      <select id="backend">
        <option value="auto">自动（优先 WebGPU）</option>
        <option value="webgpu">WebGPU</option>
        <option value="webgl">WebGL</option>
      </select>
      <p id="backend-status" role="status">正在初始化…</p>
      <label for="kernel">Kernel（<span id="kernel-language">--</span>）</label>
      <br />
      <textarea name="" id="kernel" cols="30" rows="10"></textarea>
      <br />
      <button id="apply">APPLY</button>
      <button id="cancel">CANCEL</button>
    </div>
    <div id="fps">-- FPS</div>
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
